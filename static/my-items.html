<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reported Items - Lost & Found AI</title>
    <link rel="icon" type="image/x-icon" href="/webcon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .item-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .item-card:hover { transform: translateY(-2px); box-shadow: 0 5px 10px -2px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center">
                    <img class="h-8 w-auto" src="/logo.png" alt="Logo">
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="/" class="text-gray-600 hover:text-indigo-600">Home</a>
                    <a href="found.html" class="text-gray-600 hover:text-indigo-600">Found Item</a>
                    <a href="lost.html" class="text-gray-600 hover:text-indigo-600">Lost Item</a>
                    <a href="my-items.html" class="text-indigo-600 font-medium">My Items</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900">My Reported Items</h1>
            <p class="mt-2 text-lg text-gray-600">Enter your email to find all the items you've reported.</p>
        </div>

        <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
            <form id="find-items-form">
                <label for="email" class="block text-sm font-medium text-gray-700">Your Email Address</label>
                <div class="mt-1 flex rounded-md shadow-sm">
                    <input type="email" id="email" required class="flex-1 block w-full rounded-none rounded-l-md px-3 py-2 border border-gray-300" placeholder="you@example.com">
                    <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-r-md text-white bg-indigo-600 hover:bg-indigo-700">
                        <i data-feather="search" class="h-5 w-5"></i>
                    </button>
                </div>
            </form>
        </div>

        <div id="results-container" class="mt-12">
            <p id="initial-message" class="text-center text-gray-500">Your reported items will appear here.</p>
            <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <script>
        feather.replace();

        function getStatusBadge(status) {
            if (status === 'available') return `<span class="bg-blue-100 text-blue-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full">Available</span>`;
            if (status === 'claimed') return `<span class="bg-green-100 text-green-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full">Claimed</span>`;
            if (status === 'returned') return `<span class="bg-gray-100 text-gray-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded-full">Returned</span>`;
            return '';
        }

        function createItemCard(item) {
            const itemType = item.collection === 'found_items_collection' ? 'Found' : 'Lost';
            const itemTypeColor = itemType === 'Found' ? 'text-indigo-600' : 'text-green-600';
            
            return `
                <div class="bg-white rounded-lg shadow-sm overflow-hidden item-card">
                    <a href="item-details.html?id=${item.item_id}&collection=${item.collection}">
                        <img src="${item.image_url}" alt="${item.item_name}" class="w-full h-48 object-cover">
                    </a>
                    <div class="p-4">
                        <div class="flex justify-between items-center mb-1">
                            <p class="text-sm font-bold ${itemTypeColor}">${itemType} Item</p>
                            ${getStatusBadge(item.status)}
                        </div>
                        <h3 class="font-semibold text-gray-900 truncate">${item.item_name}</h3>
                        <p class="text-sm text-gray-600">Category: ${item.category}</p>
                        <p class="text-xs text-gray-500">Reported: ${item.upload_time}</p>
                        <a href="item-details.html?id=${item.item_id}&collection=${item.collection}" class="mt-3 block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 rounded-md text-sm">
                            View Details
                        </a>
                    </div>
                </div>
            `;
        }

        document.getElementById('find-items-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const initialMessage = document.getElementById('initial-message');
            const itemsGrid = document.getElementById('items-grid');
            
            initialMessage.textContent = 'Searching for your items...';
            itemsGrid.innerHTML = '';

            try {
                const response = await fetch('/api/get-items-by-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (!response.ok) {
                    throw new Error('Could not fetch items.');
                }

                const items = await response.json();

                if (items.length === 0) {
                    initialMessage.textContent = 'No items found for this email address.';
                } else {
                    initialMessage.style.display = 'none';
                    itemsGrid.innerHTML = items.map(createItemCard).join('');
                }
            } catch (error) {
                initialMessage.textContent = 'An error occurred. Please try again.';
                console.error(error);
            }
            feather.replace();
        });
    </script>
</body>
</html>
